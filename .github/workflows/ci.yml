name: CI

# Read-only. Every job checks out, installs, and runs lint/build/test; none
# writes to the repository, publishes, or posts to a pull request. Without this
# block the jobs inherit whatever the repository default grants, which is a
# broader token than any step here uses. (bot-guardrail additionally reads PR
# metadata via its own job-level grant.)
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # Tier 1 regression gate: hermetic golden-baseline suites (staleness +
  # retrieval). Also runs inside `npm test` above; this named job is the
  # required PR check with an isolated, readable signal.
  # docs/superpowers/specs/2026-07-07-regression-suite-design.md
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/regression

  # Technical backstop for the agent lanes (delegate.yml, @claude): prompt
  # rules telling agents not to touch the automation surface are policy, not
  # enforcement. This check FAILS any bot-authored PR that modifies
  # .github/** or .claude/** — workflows, guardrails, permission allowlists —
  # so such a PR can never merge quietly; a human must see red and decide.
  # Human-authored PRs (like this one) are exempt: the job skips.
  bot-guardrail:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject bot changes to the automation surface
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Fail CLOSED: if the file listing itself errors (auth, rate
          # limit, network), the guard must fail — a green result must mean
          # "checked and clean", never "couldn't check".
          FILES="$(gh pr view "$PR_URL" --json files -q '.files[].path')" || {
            echo "::error::gh pr view failed — cannot verify automation surface" >&2
            exit 1
          }
          TOUCHED="$(grep -E '^(\.github/|\.claude/)' <<<"$FILES" || true)"
          if [ -n "$TOUCHED" ]; then
            echo "Bot-authored PR modifies the automation surface:" >&2
            echo "$TOUCHED" >&2
            echo "Agents must not change workflows, guardrails, or allowlists." >&2
            echo "A human can re-author these changes on their own branch." >&2
            exit 1
          fi
          echo "No automation-surface changes."

  # End-to-end gate: spawns the built dist/cli.js as a real subprocess and
  # drives it over MCP stdio — handshake, tool catalog, read/write with git
  # auto-commit, search, RBAC. Also runs inside `npm test` above; this named
  # job is the required PR check that proves the shipped artifact boots.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run test/e2e
