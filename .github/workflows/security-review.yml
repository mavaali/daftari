# Automatic security review on every PR.
#
# Claude analyzes the diff for injection, auth/ACL, path-traversal, and
# data-exposure issues and comments findings on the PR. Particularly
# relevant here: RBAC enforcement and the existence-disclosure invariants
# (omission over redaction, no existence leak) are security surfaces.
# Requires the ANTHROPIC_API_KEY repo secret — this action does not yet
# support subscription OAuth tokens, so it stays on metered API billing
# (one Sonnet 5 run per PR).

name: Security Review

# Runs once when the PR is opened or leaves draft — not on every push.
# Findings can go stale on a heavily-reworked PR; re-run manually from the
# Actions tab if the diff changes substantially after review.
#
# Exception: bot-authored PRs (the delegate.yml lane) also run on
# synchronize. Their open event is created with the workflow token, which
# GitHub never lets trigger workflows — without this, agent-authored PRs
# would be the ONLY PRs that skip security review, inverting the intent.
# The delegate prompt arms the checks with a single empty-commit push;
# later agent pushes to the same PR re-run the review, which is accepted
# (agent PRs are rare and small, and re-review after a rework is a
# feature there, not a cost).
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  security-review:
    # Skipped for Dependabot PRs: GitHub doesn't forward repo secrets to
    # Dependabot-triggered runs, so ANTHROPIC_API_KEY would be empty and
    # the job fails before doing anything useful. (The synchronize arm
    # also excludes dependabot[bot]-AUTHORED PRs: a human updating such a
    # branch would otherwise pay a review per update.)
    if: >
      ${{
        !github.event.pull_request.draft &&
        github.actor != 'dependabot[bot]' &&
        (github.event.action != 'synchronize' ||
         (github.event.pull_request.user.type == 'Bot' &&
          github.event.pull_request.user.login != 'dependabot[bot]'))
      }}
    runs-on: ubuntu-latest
    # A hung Claude review otherwise sits until GitHub's 6h default, wedging
    # the auto-merge queue with no recovery (see PR #446: ~1h52m hang). A
    # normal review is a few minutes; 20 fails a stuck run fast + visibly.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Run security review
        # Pinned to a reviewed commit SHA: this third-party action receives
        # ANTHROPIC_API_KEY and a pull-requests:write token, so a mutable
        # `@main` would let an upstream compromise or branch retarget run with
        # those credentials. Dependabot (github-actions ecosystem) bumps the pin.
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          claude-model: claude-sonnet-5
