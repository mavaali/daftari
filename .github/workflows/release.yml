# Tag-driven npm release via OIDC trusted publishing.
#
# No NPM_TOKEN secret and no OTP: npm trusts this workflow's GitHub Actions
# identity directly (id-token: write), so account MFA stays fully enforced
# for humans while CI publishes unattended. Provenance attestation is
# automatic with trusted publishing.
#
# One-time setup on npmjs.com (package settings → Publishing access):
#   Trusted Publisher = GitHub Actions, repository mavaali/daftari,
#   workflow release.yml. Then select "Require two-factor authentication
#   and disallow tokens" so OIDC is the only non-interactive publish path.
#
# To release: bump `version` in package.json (release PR), merge, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The tag push publishes to npm AND creates the GitHub Release page, with
# the tag's CHANGELOG section as the notes (v1.30.0/v1.31.0 shipped to npm
# but never got a Releases page — the page was a forgotten manual step).
# Attaching artifacts (the .mcpb) to the page remains a maintainer step:
#   gh release upload vX.Y.Z daftari-X.Y.Z.mcpb
#
# After npm, the same tag publishes server.json to the official MCP registry
# (registry.modelcontextprotocol.io) via GitHub OIDC — the io.github.mavaali/*
# namespace is proven by this repo's identity, no secret. Before tagging, run
# `npm run build && npm run sync:release` in the release PR so server.json and
# manifest.json carry the new version; test/release-metadata.test.ts (run by
# CI and the gate below) fails on drift.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Install and test with the BUNDLED npm (10), exactly like ci.yml's
      # green jobs: installing with npm@latest first left better-sqlite3
      # without its native binding and failed `npm test` on every attempt
      # of v1.31.0 (missing-bindings, deterministic across re-runs).
      - run: npm ci

      # A release runs every gate CI runs — a tag is not a bypass.
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # Trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.
      # Upgraded only AFTER install+tests, purely for the publish step.
      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm publish

  # Publish the GitHub Release page for this tag, notes taken verbatim from
  # the tag's CHANGELOG section. A SEPARATE job so the contents:write token
  # never coexists with the steps that execute third-party code (npm ci,
  # lint, build, test) — the publish job stays contents:read. `needs` orders
  # it after npm publish, so a failed publish never leaves a release page
  # announcing a version npm doesn't have. Idempotent: a re-run (or a
  # manually pre-created page) skips instead of failing.
  github-release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write # create the GitHub Release for the pushed tag
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "No CHANGELOG section found for $VERSION — falling back to a link." >&2
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." > "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # Publish server.json to the official MCP registry (slrf). Separate job,
  # after npm: the registry verifies the npm package's `mcpName`, so the
  # version must exist on npm first. mcp-publisher is pinned + checksummed —
  # it runs with this job's OIDC token.
  mcp-registry:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      id-token: write # OIDC login for the io.github.mavaali namespace
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v7
      - name: Verify server.json version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRV="$(node -p "require('./server.json').version")"
          if [ "$TAG" != "$SRV" ]; then
            echo "server.json version $SRV does not match tag v$TAG — run npm run sync:release" >&2
            exit 1
          fi
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
