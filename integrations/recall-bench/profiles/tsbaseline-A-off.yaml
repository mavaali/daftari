# Timestamp-baseline SMOKE — ARM A (timestamps OFF).
# The answerer's tool output is date-scrubbed: it never sees a calendar date.
# Answerer routed through OpenRouter (haiku) — no ANTHROPIC_API_KEY needed.
# `timestamps` is QUOTED: bare on/off are YAML booleans.
persona:
  id: executive-assistant
  dir: /Users/mihirwagle/projects/recall-review/packages/recall-bench/personas/executive-assistant
  arcs: arcs-180d.yaml
env:
  file: /Users/mihirwagle/projects/daftari/.worktrees/timestamp-baseline/integrations/recall-bench/.env
models:
  judge: openai:openai/gpt-5.4-mini
harness:
  adapter: /Users/mihirwagle/projects/daftari/.worktrees/timestamp-baseline/integrations/recall-bench/dist/index.js
  factory: createDaftariAdapter
  config:
    answererModel: anthropic/claude-haiku-4.5
    answererTransport: "openrouter"
    maxSearchResults: 15
    agentMaxIterations: 6
    timestamps: "off"
run:
  ranges:
    start: 30
    end: 30
    step: 30
  seed: 42
  sample: 8
  parallelism: 4
  timeout: 120000
  judgeMemoryWindow: 1
  groupsEnabled: false
